coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: 80%
        threshold: 1%

flags:
  backend:
    paths:
      - backend/src/
    carryforward: true
  frontend:
    paths:
      - frontend/src/
    carryforward: true

ignore:
  - '**/tests/**'
  - '**/__tests__/**'
  - '**/__mocks__/**'
  - '**/*.test.ts'
  - '**/*.test.tsx'
  - 'frontend/src/setupTests.ts'
  - '**/*.config.*'
