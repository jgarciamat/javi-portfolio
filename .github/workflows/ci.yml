name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend – format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npx prettier --check "src/**/*.ts"
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage -- --ci
      - run: npm run build
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend – format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        env:
          HUSKY: '0'
      - run: npx prettier --check "src/**/*.{ts,tsx}"
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:coverage -- --ci
      - run: npm run build
      - uses: codecov/codecov-action@v7
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false

  e2e:
    name: E2E – Playwright smoke (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
        env:
          HUSKY: '0'
      - run: npm ci
        working-directory: frontend
        env:
          HUSKY: '0'
      # Starts its own API (fresh database, demo user) and Vite; uses the runner's Chrome.
      - run: npm run e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t money-manager-api:ci backend
      - run: docker build -t money-manager-web:ci frontend
      - name: API container starts and is healthy
        run: |
          docker run -d --name api -e JWT_SECRET="$(openssl rand -base64 48)" money-manager-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' api)
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs api
          exit 1
