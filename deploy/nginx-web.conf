# Brotli for the browsers that accept it. The official nginx image has no brotli module, so the
# files compressed at build time (scripts/compress.mjs writes `<file>.br` and `<file>.gz` for every
# script and stylesheet) are picked by hand; gzip_static covers the rest.
map $http_accept_encoding $br_suffix {
  default "";
  "~*\bbr\b" ".br";
}
map $http_accept_encoding $br_encoding {
  default "";
  "~*\bbr\b" "br";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # No access log: the privacy policy promises technical logs without IPs or browsing history.
  access_log off;

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    try_files $uri =404;
    gzip_static on;
    gzip_vary on;
    add_header Cache-Control "public, max-age=31536000, immutable";

    # `types` is emptied so the .br file keeps the type of the original one.
    location ~ \.m?js$ {
      types {}
      default_type application/javascript;
      try_files $uri$br_suffix =404;
      add_header Content-Encoding $br_encoding;
      gzip_vary off;
      add_header Vary Accept-Encoding;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~ \.css$ {
      types {}
      default_type text/css;
      try_files $uri$br_suffix =404;
      add_header Content-Encoding $br_encoding;
      gzip_vary off;
      add_header Vary Accept-Encoding;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }

  # The receipt scanner's files: big, they never change, and the Android app loads them from here.
  location /ocr/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
  }

  # The service worker and the app shell must always be revalidated, otherwise
  # installed PWAs keep running an old version after a deploy.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|index\.html|site\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Public pages are prerendered as <route>/index.html (Spanish) and /en/<route>/index.html
  # (English): serve them at the address without a trailing slash (no redirect, so the canonical
  # URLs are the ones that answer). The screens only reached from an email get the app shell.
  # Any other address is a real 404 (not a copy of the home page): 404.html still loads the app,
  # which sends people to the home page.
  absolute_redirect off;
  # The guides are only in Spanish: their English address leads to the Spanish one.
  location ~ ^/en(/guias(/.*)?)$ {
    return 301 $1$is_args$args;
  }
  location ~ ^(/en)?/(verify-email|reset-password)/?$ {
    add_header Cache-Control "no-cache";
    try_files /index.html =404;
  }
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri/index.html $uri =404;
  }
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header Cache-Control "no-cache";
  }
}
