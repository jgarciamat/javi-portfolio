server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change: cache them for a year.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The receipt scanner's files: big, they never change, and the Android app loads them from here.
  location /ocr/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=2592000";
    add_header Access-Control-Allow-Origin "*";
  }

  # The service worker and the app shell must always be revalidated, otherwise
  # installed PWAs keep running an old version after a deploy.
  location ~* ^/(sw\.js|registerSW\.js|workbox-.*\.js|index\.html|site\.webmanifest)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Public pages are prerendered as <route>/index.html: serve them at the address without a
  # trailing slash (no redirect, so the canonical URLs are the ones that answer), then fall
  # back to the app shell for every other route.
  absolute_redirect off;
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri/index.html $uri /index.html;
  }
}
