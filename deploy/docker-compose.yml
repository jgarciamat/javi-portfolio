# Docker keeps container logs (stdout/stderr) on disk; cap them at 3 x 10 MB per
# service so old request logs are rotated away.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Hardening shared by the services. Limits are sized for a 4 GB server (about 1.3 GB reserved
# for the containers, the rest for the system, builds and the page cache). How to measure and
# adjust them: deploy/MONITORIZACION.md, section "Límites de Docker".
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    <<: *hardening
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 200
    # The admin API (127.0.0.1:2019, not published) answers while the server is up.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started
      api:
        condition: service_healthy

  web:
    build:
      context: ../frontend
    image: money-manager-web:latest
    restart: unless-stopped
    <<: *hardening
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5
    pids_limit: 100
    # The image already has a HEALTHCHECK (wget http://127.0.0.1/); repeated here so compose
    # shows it and the limits above cannot silently remove it.
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx-web.conf:/etc/nginx/conf.d/default.conf:ro

  api:
    build:
      context: ../backend
    image: money-manager-api:latest
    restart: unless-stopped
    <<: *hardening
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Secrets and settings live in deploy/.env (see .env.example). The variables
    # below are fixed by the container layout and override the file.
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      # The month changes at midnight in Spain, not in UTC: «today», the current period and the
      # automatic operations of the 1st follow this zone (backend/src/domain/shared/period.ts).
      TZ: Europe/Madrid
      # The V8 heap stays under the container limit (768 MB) so Node collects before Docker kills it.
      NODE_OPTIONS: --max-old-space-size=512
      DATABASE_PATH: /data/money-manager.db
      AFFILIATES_FILE: /config/affiliates.json
      BACKUP_DIR: /backups
      # Cloudflare -> Caddy -> API: two proxies, so rate limits see the visitor's real IP.
      TRUST_PROXY: "2"
      # Public client id (the web bundle carries the same one): without it "Sign in with Google"
      # is disabled. deploy/.env may override it with its own GOOGLE_CLIENT_ID.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-222588618476-je92uouf083h8vr2ef7hrrqbkrop1u2p.apps.googleusercontent.com}
    volumes:
      - api_db:/data
      - api_backups:/backups
      # Partner offers: edit deploy/config/affiliates.json in the repo and deploy.
      - ./config/affiliates.json:/config/affiliates.json:ro
    stop_grace_period: 15s

volumes:
  # SQLite database (WAL files included). Never stored inside the git checkout.
  api_db:
  # Daily online backups written by the API (retention: BACKUP_RETENTION_DAYS).
  # Copy this volume off the server regularly, e.g. with rclone or restic.
  api_backups:
  caddy_data:
  caddy_config:
